<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maisa Gás</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#0a1f44,#0066ff);
color:white;
overflow-x:hidden;
}

/* HEADER */
.header{text-align:center;padding:30px 15px;}

.logo{
width:140px;height:140px;object-fit:cover;
border-radius:50%;border:4px solid white;
box-shadow:0 5px 25px rgba(0,0,0,0.4);
}

/* MENU */
nav{
display:flex;justify-content:center;gap:20px;
background:rgba(255,255,255,0.1);
padding:10px;backdrop-filter:blur(10px);
}

/* TELAS */
.screen{display:none;padding:20px;}
.active{display:block;}

/* MOTO */
.moto{
position:fixed;
bottom:80px;
left:-200px;
width:140px;
animation:andar 10s linear infinite;
z-index:1;
}

/* FUMAÇA */
.fumaca{
position:fixed;
bottom:95px;
left:0;
width:20px;height:20px;
background:rgba(255,255,255,0.5);
border-radius:50%;
animation:fuma 2s infinite;
}

@keyframes fuma{
0%{transform:scale(0.5);opacity:0.7;}
100%{transform:scale(2);opacity:0;}
}

@keyframes andar{
0%{left:-200px;}
100%{left:120%;}
}

/* CARD */
.card{
background:white;color:black;
border-radius:20px;padding:20px;
max-width:420px;margin:20px auto;
box-shadow:0 15px 40px rgba(0,0,0,0.3);
text-align:center;
animation:fade .6s;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

.total{font-size:34px;font-weight:bold;color:#0a1f44;}

.btn{
width:100%;padding:15px;border:none;
border-radius:12px;background:#25d366;
color:white;font-size:17px;margin-top:10px;
cursor:pointer;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

.pix{background:#f5f5f5;padding:12px;border-radius:10px;margin-top:10px;}

select{width:100%;padding:10px;margin-top:10px;border-radius:10px;}

.float{
position:fixed;bottom:20px;right:20px;
background:#25d366;padding:16px;
border-radius:50%;font-size:22px;
}

.chat{
position:fixed;bottom:90px;right:20px;
width:260px;background:white;color:black;
border-radius:15px;padding:10px;
}

.badge{
background:#0066ff;color:white;
padding:6px 12px;border-radius:20px;
font-size:13px;margin-bottom:10px;
display:inline-block;
}

.beneficio{
background:#e8f0ff;color:#0033cc;
padding:10px;border-radius:10px;
margin-bottom:10px;font-weight:600;
}

.sound-btn{
position:fixed;
top:20px;right:20px;
background:#fff;color:#000;
padding:10px;border-radius:10px;
cursor:pointer;
}

i{margin-right:8px;}
</style>

</head>

<body>

<div class="sound-btn" onclick="toggleAudio()">🔊 Música</div>

<audio id="musica" loop>
<source src="musica.mp3" type="audio/mpeg">
</audio>

<div class="header">
<img src="logo.png" class="logo">
<h1>Maisa Gás</h1>
<p>Guaraqueçaba - PR</p>
</div>

<nav>
<button onclick="trocar('home')">🏠 Início</button>
<button onclick="trocar('povo')">💙 Gás do Povo</button>
</nav>

<img src="moto.png" class="moto">

<!-- HOME -->

<div id="home" class="screen active">
<div class="card">

<span class="badge">Entrega rápida 🚚</span>

<h2>🔥 Botijão P13</h2>
<p class="total">R$ 132,00</p>

<a href="https://wa.me/5541992056141?text=Olá,%20quero%20gás%20P13.%20Nome:%20Endereço:" target="_blank">
<button class="btn"><i class="fa-brands fa-whatsapp"></i> Pedir Agora</button>
</a>

<div class="pix">
💳 PIX: <b>41992056141</b><br>
<button class="btn" onclick="copiarPix()">Copiar PIX</button>
</div>

</div>
</div>

<!-- GÁS DO POVO -->

<div id="povo" class="screen">
<div class="card">

<img src="gas.png" style="width:100%;height:200px;object-fit:cover;border-radius:10px;margin-bottom:10px;">

<div class="beneficio">
💙 Gás GRATUITO (retirada no depósito de gás)
</div>

<h2>Gás do Povo</h2>

<p style="font-size:14px;">
🏪 Retirada no depósito: GRÁTIS<br>
🚚 Entrega em casa: R$25
</p>

<select id="tipo" onchange="calcular()">
<option value="retirada">Retirada no depósito</option>
<option value="entrega">Entrega em casa</option>
</select>

<p class="total" id="valor">Grátis</p>

<a id="linkPovo" target="_blank">
<button class="btn"><i class="fa-brands fa-whatsapp"></i> Solicitar</button>
</a>

</div>
</div>

<div class="chat">
<b>🤖 Ajuda</b>
<input type="text" id="pergunta" placeholder="Digite...">
<div id="resposta"></div>
</div>

<a href="https://wa.me/5541992056141" class="float">
<i class="fa-brands fa-whatsapp"></i>
</a>

<script>
function trocar(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function copiarPix(){
navigator.clipboard.writeText("41992056141");
alert("PIX copiado!");
}

function calcular(){
let tipo=document.getElementById('tipo').value;
let msg="";

if(tipo==="retirada"){
document.getElementById('valor').innerText="Grátis";
msg="Quero retirar gás do povo no depósito";
}else{
document.getElementById('valor').innerText="R$ 25,00";
msg="Quero gás do povo com entrega";
}

document.getElementById('linkPovo').href="https://wa.me/5541992056141?text="+encodeURIComponent(msg);
}

function toggleAudio(){
let audio=document.getElementById("musica");
if(audio.paused){audio.play();}else{audio.pause();}
}

calcular();
</script>

</body>
</html>
