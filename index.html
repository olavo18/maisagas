<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maisa Gás</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:#f4f7fb;
color:#333;
}

/* HEADER */
.header{
background:#0a1f44;
color:white;
padding:15px 20px;
display:flex;
align-items:center;
justify-content:space-between;
}

.header img{
width:60px;height:60px;border-radius:50%;
}

.header h1{
font-size:20px;
}

/* MENU PROFISSIONAL */
.menu{
display:flex;
gap:25px;
}

.menu button{
background:none;
border:none;
color:white;
font-weight:600;
cursor:pointer;
position:relative;
}

.menu button::after{
content:'';
position:absolute;
width:0;
height:2px;
background:#25d366;
left:0;
bottom:-5px;
transition:.3s;
}

.menu button:hover::after{
width:100%;
}

/* SECTIONS */
.screen{
display:none;
padding:30px 15px;
}

.active{display:block;}

/* HERO */
.hero{
text-align:center;
margin-top:20px;
}

.hero h2{
font-size:28px;
color:#0a1f44;
}

.hero p{
opacity:0.7;
}

/* CARD */
.card{
background:white;
border-radius:20px;
padding:25px;
max-width:400px;
margin:20px auto;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
text-align:center;
}

.total{
font-size:32px;
color:#0a1f44;
font-weight:bold;
}

/* BOTÃO */
.btn{
background:#25d366;
color:white;
border:none;
padding:15px;
border-radius:10px;
width:100%;
font-size:16px;
cursor:pointer;
transition:.3s;
}

.btn:hover{
background:#1ebe5d;
transform:scale(1.05);
}

/* PIX */
.pix{
background:#f0f0f0;
padding:10px;
border-radius:10px;
margin-top:10px;
}

/* GÁS POVO */
.info{
background:#eaf1ff;
padding:10px;
border-radius:10px;
margin-bottom:10px;
color:#0033cc;
}

/* MOTO */
.moto{
position:fixed;
bottom:20px;
left:-200px;
width:120px;
animation:andar 12s linear infinite;
opacity:0.7;
}

@keyframes andar{
0%{left:-200px;}
100%{left:120%;}
}

/* WHATS */
.float{
position:fixed;
bottom:20px;
right:20px;
background:#25d366;
color:white;
padding:15px;
border-radius:50%;
font-size:22px;
}

/* SOM */
.sound{
position:fixed;
top:15px;
right:15px;
background:white;
padding:8px;
border-radius:8px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">
<div style="display:flex;align-items:center;gap:10px;">
<img src="logo.png">
<h1>Maisa Gás</h1>
</div>

<div class="menu">
<button onclick="trocar('home')">Início</button>
<button onclick="trocar('povo')">Gás do Povo</button>
</div>
</div>

<div class="sound" onclick="toggleAudio()">🔊</div>

<audio id="musica" loop>
<source src="musica.mp3">
</audio>

<img src="moto.png" class="moto">

<!-- HOME -->

<div id="home" class="screen active">

<div class="hero">
<h2>Entrega rápida de gás em Guaraqueçaba</h2>
<p>Peça seu gás com rapidez e segurança</p>
</div>

<div class="card">
<h3>Botijão P13</h3>
<p class="total">R$ 132,00</p>

<a href="https://wa.me/5541992056141?text=Olá,%20quero%20gás%20P13" target="_blank">
<button class="btn"><i class="fa-brands fa-whatsapp"></i> Pedir pelo WhatsApp</button>
</a>

<div class="pix">
PIX: <b>41992056141</b>
</div>

</div>

</div>

<!-- GÁS DO POVO -->

<div id="povo" class="screen">

<div class="hero">
<h2>Programa Gás do Povo</h2>
<p>Benefício social para a população</p>
</div>

<div class="card">

<img src="gas.png" style="width:100%;border-radius:10px;margin-bottom:10px;">

<div class="info">
Gás gratuito (retirada no depósito)
</div>

<p>
🏪 Retirada no depósito: Grátis<br>
🚚 Entrega: R$ 25
</p>

<a href="https://wa.me/5541992056141?text=Olá,%20quero%20gás%20do%20povo" target="_blank">
<button class="btn"><i class="fa-brands fa-whatsapp"></i> Solicitar</button>
</a>

</div>

</div>

<a href="https://wa.me/5541992056141" class="float">
<i class="fa-brands fa-whatsapp"></i>
</a>

<script>
function trocar(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function toggleAudio(){
let a=document.getElementById("musica");
if(a.paused){a.play();}else{a.pause();}
}
</script>

</body>
</html>
