<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2a5b">

<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<title>Maisa Gás</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{--azul:#0b2a5b;--azul2:#1e63ff;--bg:#f4f7fb;--verde:#25d366;--vermelho:#ff4d4d;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:var(--bg);padding-bottom:60px;}

.header{background:linear-gradient(90deg,var(--azul),#0e3b85);color:white;padding:15px;display:flex;justify-content:space-between;align-items:center;}
.logo{width:50px;height:50px;border-radius:50%;object-fit:cover;}

.menu button{background:none;border:none;color:white;margin-left:15px;font-weight:600;cursor:pointer;}
.menu button.active-tab{border-bottom:2px solid var(--verde);}

.hero{background:linear-gradient(120deg,var(--azul2),#0044cc);color:white;padding:30px;text-align:center;}
#status-loja{display:inline-block;padding:5px 15px;border-radius:20px;font-size:12px;font-weight:bold;margin-top:10px;color:white;}
.aberto{background:var(--verde);}.fechado{background:var(--vermelho);}

.card{background:white;border-radius:20px;padding:25px;max-width:400px;margin:20px auto;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.15);}
.price{font-size:34px;font-weight:bold;color:var(--azul);}
.btn{background:var(--verde);color:white;border:none;padding:15px;border-radius:12px;width:100%;font-size:16px;cursor:pointer;margin-top:10px;}
.btn-rota{background:var(--azul2);text-decoration:none;color:white;display:block;padding:10px;border-radius:8px;margin-top:15px;font-size:14px;font-weight:bold;}

.img-produto{width:100%;height:220px;object-fit:contain;border-radius:10px;margin-bottom:10px;}
.footer-info{background:white;padding:20px;margin-top:20px;border-top:2px solid #eee;text-align:center;font-size:14px;}

.moto{position:fixed;bottom:20px;left:-200px;width:100px;opacity:0.5;animation:andar 15s linear infinite;}
@keyframes andar{0%{left:-200px;}100%{left:120%;}}
.float{position:fixed;right:20px;bottom:20px;background:var(--verde);color:white;padding:15px;border-radius:50%;font-size:22px;z-index:100;}
.screen{display:none;}.active{display:block;}
</style>
</head>
<body>

<div class="header">
    <div style="display:flex;align-items:center;gap:10px;">
        <img src="logo.png" class="logo">
        <h2>Maisa Gás</h2>
    </div>
    <div class="menu">
        <button id="nav-home" class="active-tab" onclick="trocar('home')">Início</button>
        <button id="nav-povo" onclick="trocar('povo')">Gás do Povo</button>
        <button id="nav-agua" onclick="trocar('agua')">Água Mineral</button>
    </div>
</div>

<div id="home" class="screen active">
    <div class="hero"><h2>Botijão P13</h2><div id="status-loja">Verificando...</div></div>
    <div class="card">
        <img src="gas_inicio.png" class="img-produto">
        <h3>Botijão P13</h3>
        <p class="price">R$ 132,00</p>
        <a href="https://wa.me/5541992056141?text=Olá!%20Quero%20pedir%20Gás%20P13." target="_blank"><button class="btn"><i class="fa-brands fa-whatsapp"></i> Pedir Gás</button></a>
    </div>
</div>

<div id="povo" class="screen">
    <div class="hero"><h2>Gás do Povo</h2></div>
    <div class="card">
        <img src="gas.png" class="img-produto">
        <div style="background:#eaf1ff;padding:10px;border-radius:10px;margin-bottom:10px;color:#0033cc;">💙 Gás gratuito (retirada)</div>
        <a href="https://wa.me/5541992056141?text=Olá!%20Gostaria%20de%20solicitar%20o%20Gás%20do%20Povo." target="_blank"><button class="btn"><i class="fa-brands fa-whatsapp"></i> Solicitar</button></a>
    </div>
</div>

<div id="agua" class="screen">
    <div class="hero"><h2>Água Mineral</h2><p>Font Life</p></div>
    <div class="card">
        <img src="agua_font_life.png" class="img-produto">
        <p class="price">R$ 26,00</p>
        <p style="font-size:13px; color:#666">Com troca. Sem galão: R$ 49,00</p>
        <a href="https://wa.me/5541992056141?text=Olá!%20Quero%20água%20Font%20Life.%0AEndereço%3A%20" target="_blank"><button class="btn" style="background:#1e63ff;"><i class="fa-brands fa-whatsapp"></i> Pedir Água</button></a>
    </div>
</div>

<div class="footer-info">
    <h4>📍 Local de Retirada</h4>
    <p>R. Superagui, 810 - Guaraqueçaba, PR</p>
    <a href="https://www.google.com/maps/dir/?api=1&destination=-25.305603,-48.328328" target="_blank" class="btn-rota"><i class="fa-solid fa-location-dot"></i> Ver Rota no Maps</a>
</div>

<a href="https://wa.me/5541992056141" class="float"><i class="fa-brands fa-whatsapp"></i></a>

<script>
function trocar(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active-tab'));
    document.getElementById('nav-' + id).classList.add('active-tab');
}

function atualizarStatus() {
    const agora = new Date();
    const dia = agora.getDay();
    const hora = agora.getHours() + (agora.getMinutes()/60);
    const statusDiv = document.getElementById('status-loja');
    let aberto = (dia >= 1 && dia <= 6 && hora >= 9 && hora < 19.5) || (dia === 0 && hora >= 9 && hora < 12);
    statusDiv.innerHTML = aberto ? "● ABERTO AGORA" : "○ FECHADO NO MOMENTO";
    statusDiv.className = aberto ? "aberto" : "fechado";
}
atualizarStatus();
setInterval(atualizarStatus, 60000);

// REGISTRAR SERVICE WORKER PARA VIRAR APP
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
