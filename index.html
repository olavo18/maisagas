<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maisa Gás</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
--azul:#0b2a5b;
--azul2:#1e63ff;
--bg:#f4f7fb;
--verde:#25d366;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:var(--bg);}

/* HEADER */
.header{
background:linear-gradient(90deg,var(--azul),#0e3b85);
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}
.logo{width:50px;height:50px;border-radius:50%;object-fit:cover;}

/* MENU */
.menu button{
background:none;border:none;color:white;
margin-left:15px;font-weight:600;cursor:pointer;
position:relative;
}
.menu button.active-tab{border-bottom: 2px solid var(--verde);}

/* HERO */
.hero{
background:linear-gradient(120deg,var(--azul2),#0044cc);
color:white;padding:30px;text-align:center;
}

/* CARD */
.card{
background:white;border-radius:20px;padding:25px;
max-width:400px;margin:20px auto;text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}
.price{font-size:34px;font-weight:bold;color:var(--azul);}
.btn{
background:var(--verde);color:white;border:none;
padding:15px;border-radius:12px;width:100%;
font-size:16px;cursor:pointer;margin-top:10px;
}

/* AJUSTE PARA NÃO CORTAR FOTOS */
.img-produto{
width:100%;
height:220px;
object-fit:contain; /* Garante que a foto da água apareça inteira */
border-radius:10px;
margin-bottom:10px;
}

.info{background:#eaf1ff;padding:10px;border-radius:10px;margin-bottom:10px;color:#0033cc;}

/* MOTO */
.moto{
position:fixed;bottom:20px;left:-200px;width:100px;
opacity:0.5;animation:andar 15s linear infinite;
}
@keyframes andar{0%{left:-200px;}100%{left:120%;}}

.float{position:fixed;right:20px;bottom:20px;background:var(--verde);color:white;padding:15px;border-radius:50%;font-size:22px;}
.sound{position:fixed;top:80px;right:20px;background:white;padding:8px;border-radius:10px;cursor:pointer;}

.screen{display:none;}
.active{display:block;}
</style>
</head>
<body>

<div class="header">
    <div style="display:flex;align-items:center;gap:10px;">
        <img src="logo.png" class="logo">
        <h2>Maisa Gás</h2>
    </div>
    <div class="menu">
        <button id="nav-home" class="active-tab" onclick="trocar('home')">Início</button>
        <button id="nav-povo" onclick="trocar('povo')">Gás do Povo</button>
        <button id="nav-agua" onclick="trocar('agua')">Água Mineral</button>
    </div>
</div>

<div class="sound" onclick="toggleAudio()">🔊</div>
<audio id="musica" loop><source src="musica.mp3"></audio>
<img src="moto.png" class="moto">

<div id="home" class="screen active">
    <div class="hero">
        <h2>Entrega rápida de gás</h2>
        <p>Guaraqueçaba - PR</p>
    </div>
    <div class="card">
        <img src="gas.png" class="img-produto">
        <h3>Botijão P13</h3>
        <p class="price">R$ 132,00</p>
        <a href="https://wa.me/5541992056141?text=Olá,%20quero%20gás%20P13" target="_blank">
            <button class="btn"><i class="fa-brands fa-whatsapp"></i> Pedir Gás</button>
        </a>
    </div>
</div>

<div id="povo" class="screen">
    <div class="hero">
        <h2>Gás do Povo</h2>
    </div>
    <div class="card">
        <img src="gas_povo.png" class="img-produto">
        <div class="info">💙 Gás gratuito (retirada no depósito)</div>
        <p>🏪 Retirada: Grátis<br>🚚 Entrega: R$ 25</p>
        <a href="https://wa.me/5541992056141?text=Olá,%20quero%20gás%20do%20povo" target="_blank">
            <button class="btn"><i class="fa-brands fa-whatsapp"></i> Solicitar</button>
        </a>
    </div>
</div>

<div id="agua" class="screen">
    <div class="hero">
        <h2>Água Mineral</h2>
        <p>Font Life</p>
    </div>
    <div class="card">
        <img src="agua_font_life.png" class="img-produto">
        <h3>Galão 20L</h3>
        <p class="price">R$ 00,00</p>
        <div class="info">💧 Água leve e pura para sua casa</div>
        <a href="https://wa.me/5541992056141?text=Olá,%20quero%20água%20mineral" target="_blank">
            <button class="btn" style="background:#1e63ff;"><i class="fa-brands fa-whatsapp"></i> Pedir Água</button>
        </a>
    </div>
</div>

<a href="https://wa.me/5541992056141" class="float"><i class="fa-brands fa-whatsapp"></i></a>

<script>
function trocar(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    
    document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active-tab'));
    document.getElementById('nav-' + id).classList.add('active-tab');
}

function toggleAudio(){
    let a=document.getElementById("musica");
    if(a.paused){a.play();}else{a.pause();}
}
</script>
</body>
</html>
