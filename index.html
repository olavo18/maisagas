<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maisa Gás</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#0a1f44,#007bff);
color:white;
}

/* TOPO */
.header{
text-align:center;
padding:30px 20px;
animation:fade 1s;
}

.logo{
width:180px;
margin-bottom:10px;
}

.header h1{
font-size:28px;
}

/* MENU */
nav{
display:flex;
justify-content:center;
gap:20px;
background:rgba(255,255,255,0.1);
padding:10px;
backdrop-filter:blur(10px);
}

nav button{
background:none;
border:none;
color:white;
font-size:15px;
cursor:pointer;
}

/* TELAS */
.screen{
display:none;
padding:20px;
animation:fade .5s;
}

.active{display:block;}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

/* CARD */
.card{
background:white;
color:black;
border-radius:20px;
padding:20px;
max-width:420px;
margin:20px auto;
box-shadow:0 15px 35px rgba(0,0,0,0.2);
text-align:center;
}

.total{
font-size:32px;
color:#0a1f44;
font-weight:bold;
margin:10px 0;
}

/* BOTÃO */
.btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#25d366;
color:white;
font-size:16px;
margin-top:10px;
cursor:pointer;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

/* PIX */
.pix{
background:#f1f1f1;
padding:10px;
border-radius:10px;
margin-top:10px;
}

/* SELECT */
select{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
}

/* WHATS */
.float{
position:fixed;
bottom:20px;
right:20px;
background:#25d366;
padding:15px;
border-radius:50%;
color:white;
text-decoration:none;
font-size:22px;
}

/* DESTAQUE */
.badge{
background:#007bff;
color:white;
padding:5px 10px;
border-radius:20px;
font-size:12px;
display:inline-block;
margin-bottom:10px;
}
</style>

</head>

<body>

<!-- TOPO COM LOGO -->

<div class="header">
<img src="logo.png" class="logo">
<h1>Maisa Gás</h1>
<p>Guaraqueçaba - PR</p>
</div>

<nav>
<button onclick="trocar('home')">🏠 Início</button>
<button onclick="trocar('povo')">💙 Gás do Povo</button>
</nav>

<!-- INÍCIO -->

<div id="home" class="screen active">
<div class="card">

<span class="badge">Entrega rápida 🚚</span>

<h2>🔥 Botijão P13</h2>
<p class="total">R$ 132,00</p>

<a href="https://wa.me/5541992056141?text=Olá,%20quero%20pedir%201%20gás%20P13.%20Nome:%20Endereço:" target="_blank">
<button class="btn">📲 Pedir Agora</button>
</a>

<div class="pix">
💳 PIX: <b id="pix">41992056141</b><br>
<button class="btn" onclick="copiarPix()">Copiar PIX</button>
</div>

</div>
</div>

<!-- GÁS DO POVO -->

<div id="povo" class="screen">
<div class="card">

<span class="badge">Programa 💙</span>

<h2>Gás do Povo</h2>

<select id="tipo" onchange="calcular()">
<option value="101">🏪 Retirada - R$101</option>
<option value="126">🚚 Entrega - R$126</option>
</select>

<p class="total" id="valor">R$ 101,00</p>

<a id="linkPovo" target="_blank">
<button class="btn">📲 Solicitar</button>
</a>

</div>
</div>

<a href="https://wa.me/5541992056141" class="float">💬</a>

<script>
function trocar(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function copiarPix(){
let pix=document.getElementById("pix").innerText;
navigator.clipboard.writeText(pix);
alert("PIX copiado!");
}

function calcular(){
let tipo=document.getElementById('tipo').value;
let texto=document.getElementById('tipo').options[document.getElementById('tipo').selectedIndex].text;

document.getElementById('valor').innerText="R$ "+tipo+",00";

let msg="Olá, quero "+texto+". Nome: Endereço:";
document.getElementById('linkPovo').href="https://wa.me/5541992056141?text="+encodeURIComponent(msg);
}

calcular();
</script>

</body>
</html>
