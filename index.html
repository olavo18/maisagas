<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maisa Gás</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#0a1f44,#0066ff);
color:white;
overflow-x:hidden;
}

/* HEADER */
.header{
text-align:center;
padding:30px 15px;
}

.logo{
width:140px;
height:140px;
object-fit:cover;
border-radius:50%;
border:4px solid white;
box-shadow:0 5px 25px rgba(0,0,0,0.4);
margin-bottom:10px;
}

/* MENU */
nav{
display:flex;
justify-content:center;
gap:20px;
background:rgba(255,255,255,0.1);
padding:10px;
backdrop-filter:blur(10px);
}

nav button{
background:none;
border:none;
color:white;
font-size:15px;
cursor:pointer;
}

/* TELAS */
.screen{
display:none;
padding:20px;
animation:fade .5s;
}

.active{display:block;}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

/* MOTO */
.moto{
position:fixed;
bottom:80px;
left:-200px;
width:140px;
animation:andar 10s linear infinite;
opacity:0.95;
pointer-events:none;
}

@keyframes andar{
0%{left:-200px;}
100%{left:120%;}
}

/* CARD */
.card{
background:white;
color:black;
border-radius:20px;
padding:20px;
max-width:420px;
margin:20px auto;
box-shadow:0 15px 40px rgba(0,0,0,0.3);
text-align:center;
animation:subir .6s;
}

@keyframes subir{
from{transform:translateY(40px);opacity:0;}
to{transform:translateY(0);opacity:1;}
}

.total{
font-size:34px;
font-weight:bold;
color:#0a1f44;
}

.btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#25d366;
color:white;
font-size:17px;
margin-top:10px;
cursor:pointer;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

/* DESTAQUE BENEFICIO */
.beneficio{
background:#e8f0ff;
color:#0033cc;
padding:10px;
border-radius:10px;
margin-bottom:10px;
font-weight:600;
}

/* PIX */
.pix{
background:#f5f5f5;
padding:12px;
border-radius:10px;
margin-top:10px;
}

select{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
}

/* WHATS */
.float{
position:fixed;
bottom:20px;
right:20px;
background:#25d366;
padding:16px;
border-radius:50%;
color:white;
font-size:22px;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

/* CHAT */
.chat{
position:fixed;
bottom:90px;
right:20px;
width:260px;
background:white;
color:black;
border-radius:15px;
padding:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.4);
}

.badge{
background:#0066ff;
color:white;
padding:6px 12px;
border-radius:20px;
font-size:13px;
margin-bottom:10px;
display:inline-block;
}

i{margin-right:8px;}
</style>

</head>

<body>

<div class="header">
<img src="logo.png" class="logo">
<h1>Maisa Gás</h1>
<p>Guaraqueçaba - PR</p>
</div>

<nav>
<button onclick="trocar('home')">🏠 Início</button>
<button onclick="trocar('povo')">💙 Gás do Povo</button>
</nav>

<img src="moto.png" class="moto">

<!-- HOME -->

<div id="home" class="screen active">
<div class="card">

<span class="badge">Entrega rápida 🚚</span>

<h2>🔥 Botijão P13</h2>
<p class="total">R$ 132,00</p>

<a href="https://wa.me/5541992056141?text=Olá,%20quero%20pedir%201%20gás%20P13.%20Nome:%20Endereço:" target="_blank">
<button class="btn"><i class="fa-brands fa-whatsapp"></i> Pedir Agora</button>
</a>

<div class="pix">
💳 PIX: <b>41992056141</b><br>
<button class="btn" onclick="copiarPix()">Copiar PIX</button>
</div>

</div>
</div>

<!-- GÁS DO POVO -->

<div id="povo" class="screen">
<div class="card">

<div style="background:#f5f5f5; padding:10px; border-radius:15px; margin-bottom:10px;">
<img src="gas.png" style="width:100%; height:200px; object-fit:cover; border-radius:10px;">
</div>

<div class="beneficio">
💙 Benefício do Governo — Gás GRATUITO
</div>

<h2>Gás do Povo</h2>

<p style="font-size:14px; opacity:0.7;">
Você não paga pelo gás, apenas taxa de entrega se quiser receber em casa.
</p>

<select id="tipo" onchange="calcular()">
<option value="0">🏪 Retirada no local - Grátis</option>
<option value="25">🚚 Entrega - R$25</option>
</select>

<p class="total" id="valor">Grátis</p>

<a id="linkPovo" target="_blank">
<button class="btn"><i class="fa-brands fa-whatsapp"></i> Solicitar Benefício</button>
</a>

</div>
</div>

<!-- CHAT -->

<div class="chat">
<b>🤖 Ajuda</b>
<input type="text" id="pergunta" placeholder="Digite sua dúvida...">
<div id="resposta"></div>
</div>

<a href="https://wa.me/5541992056141" class="float">
<i class="fa-brands fa-whatsapp"></i>
</a>

<script>
function trocar(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function copiarPix(){
navigator.clipboard.writeText("41992056141");
alert("PIX copiado!");
}

function calcular(){
let tipo=document.getElementById('tipo').value;
let texto=document.getElementById('tipo').options[document.getElementById('tipo').selectedIndex].text;

if(tipo == 0){
document.getElementById('valor').innerText="Grátis";
}else{
document.getElementById('valor').innerText="R$ "+tipo+",00";
}

let msg="Olá, quero usar o Gás do Povo ("+texto+"). Nome: Endereço:";
document.getElementById('linkPovo').href="https://wa.me/5541992056141?text="+encodeURIComponent(msg);
}

document.getElementById('pergunta').addEventListener("keyup",function(){
let t=this.value.toLowerCase();
let r=document.getElementById('resposta');

if(t.includes("preço")) r.innerText="P13 custa R$132 e Gás do povo é gratuito";
else if(t.includes("pix")) r.innerText="Você pode pagar via PIX 💳";
else if(t.includes("entrega")) r.innerText="Entrega custa apenas R$25 no benefício";
else r.innerText="";
});

calcular();
</script>

</body>
</html>
