<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2a5b">
<link rel="icon" type="image/png" href="favicon.png">

<title>Maisa Gás e Água</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --primary: #0b2a5b;
    --accent: #1e63ff;
    --success: #25d366;
    --danger: #ff4d4d;
    --bg: #f8faff;
    --white: #ffffff;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body { 
    font-family: 'Plus Jakarta Sans', sans-serif; 
    background-color: var(--bg); 
    color: #1a1a1a;
    overflow-x: hidden;
    /* Ajuste para não cobrir o conteúdo */
    padding-bottom: 120px; 
}

/* HEADER COMPACTO */
.header {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(8px);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
}

.logo-area { display: flex; align-items: center; gap: 10px; }
.logo { width: 35px; height: 35px; border-radius: 10px; object-fit: cover;}

#status-loja {
    font-size: 9px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 8px;
    color: var(--white);
}
.aberto { background: var(--success); }
.fechado { background: var(--danger); }

/* MENU INFERIOR FIXO */
.menu-inferior {
    position: fixed; bottom: 15px; left: 15px; right: 15px;
    background: var(--primary);
    border-radius: 20px;
    display: flex;
    justify-content: space-around;
    padding: 12px;
    box-shadow: 0 10px 25px rgba(11, 42, 91, 0.3);
    z-index: 2000;
}

.menu-item {
    background: none; border: none; color: rgba(255, 255, 255, 0.5);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 9px; font-weight: 600; cursor: pointer;
}

.menu-item i { font-size: 20px; }
.menu-item.active-tab { color: var(--white); }
.menu-item.active-tab i { color: #5ce1ff; }

/* CONTAINER PARA CABER NA TELA */
.container { padding: 15px; }

.card {
    background: var(--white);
    border-radius: 25px;
    padding: 20px;
    max-width: 400px;
    margin: 0 auto;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
}

/* IMAGENS MENORES PARA CABER TUDO SEM ROLAR */
.img-produto {
    width: 100%; 
    height: 160px; /* Reduzi de 220px para 160px */
    object-fit: contain;
    margin-bottom: 15px;
}

.card h3 { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 5px; }
.card p.desc { font-size: 13px; color: #718096; margin-bottom: 15px; }

.price { 
    display: inline-block;
    background: #f1f5f9;
    padding: 8px 16px;
    border-radius: 12px;
    font-size: 28px; 
    font-weight: 800; 
    color: var(--primary);
    margin-bottom: 15px;
}

.btn-w {
    background: var(--success);
    color: var(--white);
    padding: 16px;
    border-radius: 18px;
    width: 100%;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

/* AJUSTE GÁS DO POVO */
.info-box {
    text-align: left;
    background: #f0f7ff;
    padding: 12px;
    border-radius: 15px;
    margin-bottom: 15px;
    font-size: 12px;
}

.flow { display: flex; justify-content: center; gap: 15px; margin: 15px 0; }
.flow-icon { 
    width: 40px; height: 40px; background: #fff; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.screen { display: none; }
.active { display: block; animation: slideUp 0.3s ease-out; }

@keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<header class="header">
    <div class="logo-area">
        <img src="logo.png" class="logo">
        <h2 style="font-size: 15px; font-weight: 800; color: var(--primary);">Maisa Gás</h2>
    </div>
    <div id="status-loja">...</div>
</header>

<nav class="menu-inferior">
    <button id="nav-home" class="menu-item active-tab" onclick="trocar('home')">
        <i class="fa-solid fa-fire"></i> Gás P13
    </button>
    <button id="nav-agua" class="menu-item" onclick="trocar('agua')">
        <i class="fa-solid fa-droplet"></i> Água 20L
    </button>
    <button id="nav-povo" class="menu-item" onclick="trocar('povo')">
        <i class="fa-solid fa-credit-card"></i> Gás do Povo
    </button>
</nav>

<main class="container">

    <section id="home" class="screen active">
        <div class="card">
            <h3>Botijão P13</h3>
            <img src="gas_inicio.png" class="img-produto">
            <div class="price">R$ 132,00</div>
            <a href="https://wa.me/5541992056141?text=Olá!%20Quero%20pedir%20um%20Gás%20P13" target="_blank" class="btn-w">
                <i class="fa-brands fa-whatsapp"></i> PEDIR AGORA
            </a>
        </div>
    </section>

    <section id="agua" class="screen">
        <div class="card">
            <h3>Água Font Life</h3>
            <img src="agua_font_life.png" class="img-produto">
            <div class="price">R$ 26,00</div>
            <a href="https://wa.me/5541992056141?text=Olá!%20Quero%20pedir%20Água%20Mineral" target="_blank" class="btn-w" style="background: var(--accent);">
                <i class="fa-brands fa-whatsapp"></i> PEDIR ÁGUA
            </a>
        </div>
    </section>

    <section id="povo" class="screen">
        <div class="card">
            <h3 style="margin-bottom: 10px;">Gás do Povo</h3>
            <div class="info-box">
                <p><b>• Cartão:</b> Pague com o cartão do benefício.</p>
                <p><b>• Retirada:</b> Grátis na loja com galão vazio.</p>
                <p><b>• Entrega:</b> Taxa de R$ 25,00.</p>
            </div>
            <div class="flow">
                <div class="flow-icon"><i class="fa-solid fa-credit-card"></i></div>
                <div class="flow-icon" style="color: var(--success);"><i class="fa-solid fa-check"></i></div>
                <div class="flow-icon" style="color: var(--accent);"><i class="fa-solid fa-fire"></i></div>
            </div>
            <a href="https://wa.me/5541992056141?text=Olá!%20Dúvida%20sobre%20Gás%20do%20Povo" target="_blank" class="btn-w">
                <i class="fa-brands fa-whatsapp"></i> TIRAR DÚVIDAS
            </a>
        </div>
    </section>

</main>

<script>
function trocar(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('.menu-item').forEach(b => b.classList.remove('active-tab'));
    document.getElementById('nav-' + id).classList.add('active-tab');
    window.scrollTo(0,0);
}

function atualizarStatus() {
    const agora = new Date();
    const dia = agora.getDay();
    const hora = agora.getHours() + (agora.getMinutes()/60);
    const statusDiv = document.getElementById('status-loja');
    let aberto = (dia >= 1 && dia <= 6 && hora >= 9 && hora < 19.5) || (dia === 0 && hora >= 9 && hora < 12);
    statusDiv.innerHTML = aberto ? "● ABERTO" : "○ FECHADO";
    statusDiv.className = aberto ? "aberto" : "fechado";
}
atualizarStatus();
setInterval(atualizarStatus, 60000);

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
